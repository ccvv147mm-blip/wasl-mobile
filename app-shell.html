<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>وَصْل</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f172a;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        display: grid;
        place-items: center;
        text-align: center;
      }
      .ring {
        width: 42px;
        height: 42px;
        margin: 0 auto 14px;
        border: 3px solid rgba(226, 232, 240, 0.25);
        border-top-color: #e2e8f0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div>
      <div class="ring"></div>
      <p>جارٍ تحميل وَصْل…</p>
    </div>
    <script>
      // شاشة انتظار داخل التطبيق الأصلي حتى يُحمّل الموقع المنشور.
      setTimeout(function () {
        location.replace("https://arab-spark-ai.lovable.app");
      }, 300);
    </script>
  </body>
</html>
