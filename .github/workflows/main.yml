name: Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build

      - name: Add Android Platform and Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Copy Keystore to Android App Folder
        run: |
          mkdir -p android/app
          cp keystore.jks android/app/keystore.jks

      - name: Configure Signing in build.gradle
        run: |
          echo "" >> android/app/build.gradle
          echo "android {" >> android/app/build.gradle
          echo "    signingConfigs {" >> android/app/build.gradle
          echo "        release {" >> android/app/build.gradle
          echo "            storeFile file('keystore.jks')" >> android/app/build.gradle
          echo "            storePassword 'Password123'" >> android/app/build.gradle
          echo "            keyAlias 'my-key'" >> android/app/build.gradle
          echo "            keyPassword 'Password123'" >> android/app/build.gradle
          echo "        }" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "    buildTypes {" >> android/app/build.gradle
          echo "        release {" >> android/app/build.gradle
          echo "            signingConfig signingConfigs.release" >> android/app/build.gradle
          echo "        }" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

      - name: Build Signed AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload Artifacts (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: release-outputs
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            
