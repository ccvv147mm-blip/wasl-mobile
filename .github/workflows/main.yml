name: Build Signed Android Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build

      - name: Add Android Platform & Sign AAB
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          npx cap add android || true
          npx cap sync android
          if [ -d "android" ]; then
            cd android
            # فك تشفير المفتاح في مجلد app
            echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > app/keystore.jks
            
            # حقن إعدادات التوقيع في ملف build.gradle تلقائياً
            BUILD_GRADLE="app/build.gradle"
            if grep -q "signingConfigs" "$BUILD_GRADLE"; then
              echo "Signing config already exists"
            else
              sed -i '/ buildTypes { про /i \
    signingConfigs {\
        release {\
            storeFile file("keystore.jks")\
            storePassword "mypassword"\
            keyAlias "myalias"\
            keyPassword "mypassword"\
        }\
    }' "$BUILD_GRADLE"
              
              # استبدال القيم الحقيقية من الأسرار
              sed -i "s/storePassword \"mypassword\"/storePassword \"$STORE_PASSWORD\"/g" "$BUILD_GRADLE"
              sed -i "s/keyPassword \"mypassword\"/keyPassword \"$KEY_PASSWORD\"/g" "$BUILD_GRADLE"
              sed -i "s/keyAlias \"myalias\"/keyAlias \"$KEY_ALIAS\"/g" "$BUILD_GRADLE"
              sed -i 's/minifyEnabled false/minifyEnabled true/g' "$BUILD_GRADLE" || true
              sed -i '/ buildTypes {/,+10 s/release {/release {\n\t\t\tsigningConfig signingConfigs.release/g' "$BUILD_GRADLE"
            fi

            chmod +x gradlew
            ./gradlew bundleRelease
          fi

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          
