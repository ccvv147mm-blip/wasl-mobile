name: Build Signed Android Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build

      - name: Add Android Platform & Sign AAB
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          npx cap add android || true
          npx cap sync android
          if [ -d "android" ]; then
            cd android
            echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > app/keystore.jks
            
            BUILD_GRADLE="app/build.gradle"
            if ! grep -q "signingConfigs" "$BUILD_GRADLE"; then
              sed -i '/ buildTypes {/i \
           signingConfigs {\
                     release {\
               storeFile file("keystore.jks")\
            storePassword "'"$STORE_PASSWORD"'"\
            keyAlias "'"$KEY_ALIAS"'"\
            keyPassword "'"$KEY_PASSWORD"'"\
               }\
              }' "$BUILD_GRADLE"
              sed -i '/ buildTypes {/,+10 s/release {/release {\n            signingConfig signingConfigs.release/g' "$BUILD_GRADLE"
            fi

            chmod +x gradlew
            ./gradlew bundleRelease
          fi

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          
