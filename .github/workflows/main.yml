name: Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate New Keystore and Export PEM Certificate
        run: |
          keytool -genkey -v -keystore app/keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-key -storepass Password123 -keypass Password123 -dname "CN=Android, OU=Development, O=App, L=Cairo, ST=Cairo, C=EG"
          keytool -export -rfc -keystore app/keystore.jks -alias my-key -file upload_certificate.pem -storepass Password123

      - name: Build Signed AAB
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-outputs
          path: |
            app/build/outputs/bundle/release/app-release.aab
            upload_certificate.pem
            
