name: Build Signed Android Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build

      - name: Generate Keystore & Build AAB
        run: |
          npx cap add android || true
          npx cap sync android
          
          if [ -d "android" ]; then
            cd android
            
            # توليد مفتاح توقيع جديد وصحيح تلقائياً داخل السيرفر
            keytool -genkey -v -keystore app/keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-key -storepass Password123 -keypass Password123 -dname "CN=Android, OU=Development, O=App, L=Cairo, ST=Cairo, C=EG"

            # حقن إعدادات التوقيع في ملف build.gradle
            echo "" >> app/build.gradle
            echo "android {" >> app/build.gradle
            echo "    signingConfigs {" >> app/build.gradle
            echo "        release {" >> app/build.gradle
            echo "            storeFile file('keystore.jks')" >> app/build.gradle
            echo "            storePassword 'Password123'" >> app/build.gradle
            echo "            keyAlias 'my-key'" >> app/build.gradle
            echo "            keyPassword 'Password123'" >> app/build.gradle
            echo "        }" >> app/build.gradle
            echo "    }" >> app/build.gradle
            echo "    buildTypes {" >> app/build.gradle
            echo "        release {" >> app/build.gradle
            echo "            signingConfig signingConfigs.release" >> app/build.gradle
            echo "        }" >> app/build.gradle
            echo "    }" >> app/build.gradle
            echo "}" >> app/build.gradle

            chmod +x gradlew
            ./gradlew bundleRelease
          fi

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          
