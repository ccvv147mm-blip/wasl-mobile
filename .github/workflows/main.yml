     - name: Add Android Platform & Sign AAB
       env:
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }} 
        run: |
         npx cap add android || true
         npx cap sync android
         if [ -d "android" ]; then
          cd android
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > app/keystore.jks

          BUILD_GRADLE="app/build.gradle"
          if ! grep -q "signingConfigs" "$BUILD_GRADLE"; then
            # إضافة الـ signingConfigs وكتابة الـ signingConfig مباشرة داخل الـ buildTypes وتحديداً جوه release
            python3 -c '
            with open("app/build.gradle", "r") as f:
                content = f.read()

            signing_block = """
            signingConfigs {
                release {
                    storeFile file("keystore.jks")
                    storePassword "'"$STORE_PASSWORD"'"
                    keyAlias "'"$KEY_ALIAS"'"
                    keyPassword "'"$KEY_PASSWORD"'"
                }
            }
            """

            # إدراج الـ signingConfigs قبل buildTypes
            content = content.replace("buildTypes {", signing_block + "\n    buildTypes {")

            # ربط الـ release بـ signingConfig
            content = content.replace("release {", "release {\n            signingConfig signingConfig.release")

            with open("app/build.gradle", "w") as f:
                f.write(content)
            '
          fi

          chmod +x gradlew
          ./gradlew bundleRelease
      fi
        
