name: Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build

      - name: Add Android Platform and Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate New Keystore and Export PEM Certificate
        run: |
          keytool -genkey -v -keystore android/app/keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-key -storepass Password123 -keypass Password123 -dname "CN=Android, OU=Development, O=App, L=Cairo, ST=Cairo, C=EG"
          keytool -export -rfc -keystore android/app/keystore.jks -alias my-key -file upload_certificate.pem -storepass Password123

      - name: Configure Signing in build.gradle
        run: |
          echo "" >> android/app/build.gradle
          echo "android {" >> android/app/build.gradle
          echo "    signingConfigs {" >> android/app/build.gradle
          echo "        release {" >> android/app/build.gradle
          echo "            storeFile file('keystore.jks')" >> android/app/build.gradle
          echo "            storePassword 'Password123'" >> android/app/build.gradle
          echo "            keyAlias 'my-key'" >> android/app/build.gradle
          echo "            keyPassword 'Password123'" >> android/app/build.gradle
          echo "        }" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "    buildTypes {" >> android/app/build.gradle
          echo "        release {" >> android/app/build.gradle
          echo "            signingConfig signingConfigs.release" >> android/app/build.gradle
          echo "        }" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

      - name: Build Signed AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload Artifacts (AAB and PEM Certificate)
        uses: actions/upload-artifact@v4
        with:
          name: release-outputs
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            upload_certificate.pem
            
