name: Build Signed Android Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build

      - name: Add Android Platform & Build
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          npx cap add android || true
          npx cap sync android
          
          if [ -d "android" ]; then
            cd android
            # فك ضغط ملف التوقيع مباشرة داخل مجلد الأندرويد
            echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > app/keystore.jks
            
            # حقن إعدادات التوقيع مباشرة في ملف build.gradle البرمجي أثناء البناء
            echo "" >> app/build.gradle
            echo "android {" >> app/build.gradle
            echo "    signingConfigs {" >> app/build.gradle
            echo "        release {" >> app/build.gradle
            echo "            storeFile file('keystore.jks')" >> app/build.gradle
            echo "            storePassword '$STORE_PASSWORD'" >> app/build.gradle
            echo "            keyAlias '$KEY_ALIAS'" >> app/build.gradle
            echo "            keyPassword '$KEY_PASSWORD'" >> app/build.gradle
            echo "        }" >> app/build.gradle
            echo "    }" >> app/build.gradle
            echo "    buildTypes {" >> app/build.gradle
            echo "        release {" >> app/build.gradle
            echo "            signingConfig signingConfigs.release" >> app/build.gradle
            echo "        }" >> app/build.gradle
            echo "    }" >> app/build.gradle
            echo "}" >> app/build.gradle

            chmod +x gradlew
            ./gradlew bundleRelease
          fi

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          
